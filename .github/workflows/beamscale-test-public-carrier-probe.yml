name: beamscale-test-public-carrier-probe

on:
  pull_request:
    paths:
      - '.github/workflows/beamscale-test-public-carrier-probe.yml'

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner execution
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          git --version
          printf '%s\n' 'stepful public carrier available'

  beamscale-read-credential-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require scoped BeamScale read token
        env:
          TOKEN: ${{ secrets.BMSCL_TEST_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          printf '%s\n' 'scoped BeamScale read credential available'
