name: scratch-ignore-policy

on:
  pull_request:
  push:
    branches: [main, dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratch-ignore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact caller tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify checker provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/scratch_ignore_check.rs)" = "b803657f1726950b2dbd3bc857de058a5f813654"

      - name: Install pinned minimal Rust toolchain
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update

      - name: Compile and exercise canonical checker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/scratch-ignore-policy
          source=scripts/scratch_ignore_check.rs
          rustup run 1.85.1 rustc --edition=2021 -D warnings --test "$source" -o tmp/scratch-ignore-policy/tests
          tmp/scratch-ignore-policy/tests
          rustup run 1.85.1 rustc --edition=2021 -D warnings "$source" -o tmp/scratch-ignore-policy/check
          set +e
          tmp/scratch-ignore-policy/check --unsupported >tmp/scratch-ignore-policy/argv.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          tmp/scratch-ignore-policy/check

      - name: Verify policy did not mutate tracked state
        run: git diff --exit-code
