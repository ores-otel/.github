name: Provision reviewed repository fleet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-otel-repository-fleet
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve a configured organization-administration token
        env:
          ORES_OTEL_ORG_ADMIN_TOKEN: ${{ secrets.ORES_OTEL_ORG_ADMIN_TOKEN }}
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${ORES_OTEL_ORG_ADMIN_TOKEN:-${ORG_ADMIN_TOKEN:-${GH_PAT:-${GITHUB_PAT:-${ADMIN_GITHUB_TOKEN:-}}}}}"
          if [ -z "$token" ]; then
            echo "No configured organization-administration token is available." >&2
            exit 78
          fi
          echo "::add-mask::$token"
          printf 'GH_ADMIN_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Check out the exact reviewed provisioning commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the exact provisioning inputs
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/provision-repository-fleet.py \
            scripts/provision-shared-repositories.py \
            scripts/validate-repository-templates.py
          python scripts/validate-repository-templates.py --manifest repository-fleet.json

      - name: Create, configure, seed, and verify shared repositories
        run: >-
          python scripts/provision-shared-repositories.py
          --manifest repository-fleet.json

      - name: Maintain the canonical logger and conformance fleet
        run: >-
          python scripts/provision-repository-fleet.py
          --manifest repository-fleet.json
