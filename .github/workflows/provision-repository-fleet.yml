name: Provision reviewed repository fleet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - repository-fleet.json
      - scripts/provision-repository-fleet.py
      - .github/workflows/provision-repository-fleet.yml

permissions:
  contents: write

concurrency:
  group: ores-otel-repository-fleet
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve a configured organization-administration token
        id: token
        env:
          ORES_OTEL_ORG_ADMIN_TOKEN: ${{ secrets.ORES_OTEL_ORG_ADMIN_TOKEN }}
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${ORES_OTEL_ORG_ADMIN_TOKEN:-${ORG_ADMIN_TOKEN:-${GH_PAT:-${GITHUB_PAT:-${ADMIN_GITHUB_TOKEN:-}}}}}"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            printf 'GH_ADMIN_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a one-time encrypted token handoff
        id: handoff
        if: steps.token.outputs.has_token != 'true'
        env:
          READ_WRITE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/ores-otel-bootstrap-private.pem"
          public_key="$RUNNER_TEMP/ores-otel-bootstrap-public.pem"
          plaintext="$RUNNER_TEMP/ores-otel-bootstrap-token.txt"
          sealed_binary="$RUNNER_TEMP/ores-otel-bootstrap-token.bin"
          nonce="$(openssl rand -hex 12)"
          handoff_path="bootstrap/handoff-${GITHUB_RUN_ID}-${nonce}.json"
          sealed_path="bootstrap/handoff-${GITHUB_RUN_ID}-${nonce}.sealed.b64"

          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          chmod 600 "$private_key"

          python - "$public_key" "$handoff_path" "$sealed_path" > "$RUNNER_TEMP/handoff.json" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          public_key = pathlib.Path(sys.argv[1]).read_bytes()
          print(json.dumps({
              "contract": "ores.otel.sealed-token-handoff/v1",
              "algorithm": "RSA-OAEP-SHA256",
              "run_id": "${{ github.run_id }}",
              "public_key_pem_base64": base64.b64encode(public_key).decode("ascii"),
              "handoff_path": sys.argv[2],
              "sealed_path": sys.argv[3],
          }, indent=2, sort_keys=True))
          PY

          content="$(base64 -w0 "$RUNNER_TEMP/handoff.json")"
          payload="$(jq -nc --arg message 'Open one-time encrypted bootstrap handoff' --arg content "$content" '{message:$message,content:$content,branch:"main"}')"
          curl --fail --silent --show-error \
            --request PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $READ_WRITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$REPOSITORY/contents/$handoff_path" \
            --data "$payload" >/dev/null

          echo "handoff_path=$handoff_path" >> "$GITHUB_OUTPUT"
          echo "sealed_path=$sealed_path" >> "$GITHUB_OUTPUT"
          echo "One-time public-key handoff published at $handoff_path"

          received=false
          for attempt in $(seq 1 180); do
            status="$(curl --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $READ_WRITE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$RUNNER_TEMP/sealed-response.json" \
              -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$REPOSITORY/contents/$sealed_path?ref=main")"
            if [ "$status" = 200 ]; then
              jq -r '.content' "$RUNNER_TEMP/sealed-response.json" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/sealed-text.b64"
              base64 -d "$RUNNER_TEMP/sealed-text.b64" > "$sealed_binary"
              openssl pkeyutl -decrypt \
                -inkey "$private_key" \
                -in "$sealed_binary" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256 \
                -out "$plaintext"
              token="$(cat "$plaintext")"
              if [ -z "$token" ]; then
                echo "Decrypted token was empty" >&2
                exit 1
              fi
              echo "::add-mask::$token"
              printf 'GH_ADMIN_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
              received=true
              break
            fi
            if [ "$status" != 404 ]; then
              cat "$RUNNER_TEMP/sealed-response.json" >&2
              echo "Unexpected HTTP status while waiting for sealed token: $status" >&2
              exit 1
            fi
            sleep 5
          done

          rm -f "$plaintext" "$sealed_binary" "$RUNNER_TEMP/sealed-text.b64" "$RUNNER_TEMP/sealed-response.json"
          if [ "$received" != true ]; then
            echo "Timed out waiting for the one-time encrypted token handoff" >&2
            exit 78
          fi

      - name: Fetch the exact provisioning inputs
        env:
          READ_TOKEN: ${{ github.token }}
          REF: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap/scripts
          for path in repository-fleet.json scripts/provision-repository-fleet.py; do
            target="bootstrap/$path"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github.raw+json" \
              -H "Authorization: Bearer $READ_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$REPOSITORY/contents/$path?ref=$REF" \
              > "$target"
          done
          python -m json.tool bootstrap/repository-fleet.json >/dev/null
          python -m py_compile bootstrap/scripts/provision-repository-fleet.py

      - name: Create, seed, and mirror the fleet
        run: >-
          python bootstrap/scripts/provision-repository-fleet.py
          --manifest bootstrap/repository-fleet.json

      - name: Remove one-time handoff files
        if: always() && steps.handoff.outcome != 'skipped'
        env:
          READ_WRITE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HANDOFF_PATH: ${{ steps.handoff.outputs.handoff_path }}
          SEALED_PATH: ${{ steps.handoff.outputs.sealed_path }}
        run: |
          set -euo pipefail
          for path in "$HANDOFF_PATH" "$SEALED_PATH"; do
            [ -n "$path" ] || continue
            status="$(curl --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $READ_WRITE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$RUNNER_TEMP/delete-response.json" \
              -w '%{http_code}' \
              "$GITHUB_API_URL/repos/$REPOSITORY/contents/$path?ref=main")"
            [ "$status" = 404 ] && continue
            if [ "$status" != 200 ]; then
              cat "$RUNNER_TEMP/delete-response.json" >&2
              echo "Unable to resolve handoff file for cleanup: $path ($status)" >&2
              continue
            fi
            sha="$(jq -r '.sha' "$RUNNER_TEMP/delete-response.json")"
            payload="$(jq -nc --arg message 'Close one-time encrypted bootstrap handoff' --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail --silent --show-error \
              --request DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $READ_WRITE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$REPOSITORY/contents/$path" \
              --data "$payload" >/dev/null
          done
