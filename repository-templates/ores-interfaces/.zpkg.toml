[package]
org = "ores-otel"
name = "ores-interfaces"
version = "0.1.0"
description = "Canonical polyglot contracts shared across OreSoftware organizations"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/ores-otel/ores-interfaces"

[install]
dir = "zed_modules"

[dependencies]

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".github/**", "**/target/**", "**/node_modules/**", "**/__pycache__/**", "**/.dart_tool/**", "**/build/**", "**/*.class"]
smoke_test = "python3 scripts/check_contracts.py"

[targets.contracts]
dir = "contracts"
name = "ores-platform-contracts"
adapter = "none"

[targets.rust]
dir = "languages/rust"
name = "ores-interfaces-rust"
adapter = "rust"

[targets.typescript]
dir = "languages/typescript"
name = "ores-interfaces-typescript"
adapter = "node"

[targets.golang]
dir = "languages/go"
name = "ores-interfaces-go"
adapter = "go"

[targets.python]
dir = "languages/python"
name = "ores-interfaces-python"
adapter = "python"

[targets.dart]
dir = "languages/dart"
name = "ores-interfaces-dart"
adapter = "dart"

[targets.java]
dir = "languages/java"
name = "ores-interfaces-java"
adapter = "java"

[targets.swift]
dir = "languages/swift"
name = "ores-interfaces-swift"
adapter = "none"
