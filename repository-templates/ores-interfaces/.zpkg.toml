[package]
org = "ores-otel"
name = "ores-interfaces"
version = "0.1.0"
description = "Canonical polyglot contracts shared across OreSoftware organizations"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/ores-otel/ores-interfaces"

[install]
dir = "zed_modules"

[dependencies]

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".github/**", ".zed/**", ".zpkg.lock", "zed_modules/**", "**/target/**", "**/node_modules/**", "**/__pycache__/**", "**/.dart_tool/**", "**/build/**", "**/*.class"]
smoke_test = "python3 scripts/check_contracts.py"

# Zed v0.1.0 publishes only explicit targets for a polyglot package. An
# unnamed target rooted at "." retains the canonical package coordinate
# ores-otel/ores-interfaces without colliding with the source package name.
[targets.repository]
dir = "."
adapter = "none"

[targets.contracts]
dir = "contracts"
name = "ores-platform-contracts"
adapter = "none"

[targets.shared-auth-contracts]
dir = "contracts/shared-auth"
name = "ores-shared-auth-contracts"
adapter = "none"

[targets.rust]
dir = "langs/rust"
name = "ores-interfaces-rust"
adapter = "rust"

[targets.typescript]
dir = "langs/typescript"
name = "ores-interfaces-typescript"
adapter = "node"

[targets.golang]
dir = "langs/go"
name = "ores-interfaces-go"
adapter = "go"

[targets.python]
dir = "langs/python"
name = "ores-interfaces-python"
adapter = "python"

[targets.dart]
dir = "langs/dart"
name = "ores-interfaces-dart"
adapter = "dart"

[targets.java]
dir = "langs/java"
name = "ores-interfaces-java"
adapter = "java"

[targets.swift]
dir = "langs/swift"
name = "ores-interfaces-swift"
adapter = "none"
